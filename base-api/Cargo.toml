[package]
name = "base-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "B.A.S.E. Identify API — pay-as-you-go firmware/HW discovery per contract (EXPERIMENTAL · ≠ SaaS production)"

[[bin]]
name = "base-api"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base-core = { path = "../base-core" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
