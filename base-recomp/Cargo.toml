[package]
name = "base-recomp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "B.A.S.E. static x86 → multi-ISA recompilation via SIR (≠ Wine · ≠ Win32 complete)"

[features]
default = []
# Opt-in Capstone x86 decode assist (system/lib build like specterprobe).
capstone = ["dep:capstone"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
object = "0.36"
base-core = { path = "../base-core" }
capstone = { version = "0.14", optional = true }

[lib]
name = "base_recomp"
path = "src/lib.rs"
