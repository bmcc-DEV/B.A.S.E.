# Sega Saturn synth — VDP1 @ 0x25C00000 · VDP2 @ 0x25F80000 · SMPC @ 0x20100000
# Endereços típicos New-World map (simplificados). ≠ datasheet completo.
- name: vdp1_cmd_kick
  steps:
    - event_type: mmio_write
      address: 0x25C00000
      value: 1
      tolerance_ns: 100
    - event_type: mmio_read
      address: 0x25C00004
      value: null
      tolerance_ns: 200
  max_total_ns: 5000
  max_step_ns: 3000
  order: Strict

- name: vdp2_tvmd
  steps:
    - event_type: mmio_write
      address: 0x25F80000
      value: 1
      tolerance_ns: 50
  max_total_ns: 2000
  max_step_ns: 1500
  order: Strict

- name: smpc_cmd
  steps:
    - event_type: mmio_write
      address: 0x20100000
      value: 1
      tolerance_ns: 100
    - event_type: mmio_read
      address: 0x20100004
      value: null
      tolerance_ns: 200
  max_total_ns: 5000
  max_step_ns: 3000
  order: Strict
